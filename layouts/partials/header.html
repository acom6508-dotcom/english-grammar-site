<header class="site-header">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="container">
            <div class="nav-wrapper">
                <!-- Logo -->
                <div class="nav-brand">
                    <a href="/" class="logo-link" aria-label="Home">
                        <span class="logo-text">Grammar<span class="accent">Master</span></span>
                    </a>
                </div>

                <!-- Mobile Menu Toggle -->
                <button class="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="main-menu">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>

                <!-- Navigation Menu -->
                <div class="nav-menu" id="main-menu">
                    <ul class="nav-list">
                        {{ $currentPage := . }}
                        {{ range .Site.Data.navigation.main }}
                        <li class="nav-item{{ if .children }} has-dropdown{{ end }}">
                            <a href="{{ .url }}" class="nav-link{{ if eq $currentPage.RelPermalink .url }} active{{ end }}"
                               {{ if .children }}aria-haspopup="true" aria-expanded="false"{{ end }}>
                                {{ .name }}
                                {{ if .children }}<span class="dropdown-arrow">▾</span>{{ end }}
                            </a>
                            {{ if .children }}
                            <ul class="dropdown-menu" role="menu">
                                {{ range .children }}
                                <li class="dropdown-item" role="menuitem">
                                    <a href="{{ .url }}" class="dropdown-link">{{ .name }}</a>
                                </li>
                                {{ end }}
                            </ul>
                            {{ end }}
                        </li>
                        {{ end }}
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
