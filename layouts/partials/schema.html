<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ .Site.BaseURL }}#website",
      "url": "{{ .Site.BaseURL }}",
      "name": "{{ .Site.Title }}",
      "description": "{{ .Site.Params.description }}",
      "publisher": {
        "@id": "{{ .Site.BaseURL }}#organization"
      }
    },
    {
      "@type": "Organization",
      "@id": "{{ .Site.BaseURL }}#organization",
      "name": "{{ .Site.Title }}",
      "url": "{{ .Site.BaseURL }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ .Site.Params.logo | absURL }}"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "{{ .Site.Params.email }}",
        "contactType": "Customer Service"
      }
    }
    {{ if .IsPage }}
    ,{
      "@type": "Article",
      "@id": "{{ .Permalink }}#article",
      "headline": "{{ .Title }}",
      "description": "{{ .Description }}",
      "image": "{{ if .Params.image }}{{ .Params.image | absURL }}{{ else }}{{ .Site.Params.defaultImage | absURL }}{{ end }}",
      "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
      "author": {
        "@type": "Person",
        "name": "{{ .Site.Params.author }}"
      },
      "publisher": {
        "@id": "{{ .Site.BaseURL }}#organization"
      },
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ .Permalink }}"
      }
    }
    {{ end }}
    {{ if .Params.faq }}
    ,{
      "@type": "FAQPage",
      "mainEntity": [
        {{ range $index, $item := .Params.faq }}
        {{ if $index }},{{ end }}
        {
          "@type": "Question",
          "name": "{{ $item.question }}",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "{{ $item.answer }}"
          }
        }
        {{ end }}
      ]
    }
    {{ end }}
    {{ if not .IsHome }}
    ,{
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "{{ .Site.BaseURL }}"
        }
        {{ $sections := split .RelPermalink "/" }}
        {{ $len := len $sections }}
        {{ if gt $len 2 }}
        {{ range $index, $section := $sections }}
        {{ if and (ne $section "") (ne $section "page") }}
        ,{
          "@type": "ListItem",
          "position": {{ add $index 2 }},
          "name": "{{ humanize $section }}",
          "item": "{{ $.Site.BaseURL }}{{ $section }}/"
        }
        {{ end }}
        {{ end }}
        {{ end }}
      ]
    }
    {{ end }}
  ]
}
</script>
